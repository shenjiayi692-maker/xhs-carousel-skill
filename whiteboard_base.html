<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:WK;src:url(fonts/WK-Medium.ttf);font-weight:500}
@font-face{font-family:WK;src:url(fonts/WK-Light.ttf);font-weight:300}
:root{--paper:#F8F9F6;--grid:#E2E8F0;--ink:#1F2A44;--soft:#6B7489;--red:#D8352A;--hl:#FFE14A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1440px;overflow:hidden}
body{font-family:WK,serif;font-weight:500;color:var(--ink);background-color:var(--paper);
 background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
 background-size:40px 40px;background-position:-1px 18px;position:relative}
.page{position:absolute;inset:0;padding:84px 76px 70px}
.pn{position:absolute;right:64px;top:40px;font-weight:300;font-size:30px;color:var(--soft)}
h1{font-size:66px;line-height:1.22;letter-spacing:.01em;font-weight:500}
h1 .n{display:inline-block;position:relative;color:var(--red);margin-right:34px;min-width:52px;text-align:center}
.sub{font-size:36px;color:var(--soft);font-weight:300;margin-top:14px}
p,li{font-size:38px;line-height:1.55}
ul{list-style:none}
li{position:relative;padding-left:40px;margin:6px 0}
li::before{content:"";position:absolute;left:4px;top:.72em;width:18px;height:4px;background:var(--ink);border-radius:2px;transform:rotate(-8deg)}
.hl{background:linear-gradient(176deg,transparent 52%,var(--hl) 52%,var(--hl) 90%,transparent 91%);padding:0 4px}
.red{color:var(--red)}
.small{font-size:30px;font-weight:300;color:var(--soft);line-height:1.5}
.shot{position:absolute;background:#fff;padding:10px;box-shadow:0 3px 0 rgba(31,42,68,.14),0 0 0 1px rgba(31,42,68,.06)}
.shot img{display:block;width:100%}
.tape{position:absolute;width:150px;height:44px;background:rgba(246,226,150,.72);clip-path:polygon(3% 0,97% 4%,100% 50%,96% 100%,2% 96%,0 45%)}
.mark{position:absolute;pointer-events:none}
.note{position:absolute;color:var(--red);font-size:34px;line-height:1.4}
svg.ov{position:absolute;inset:0;width:1080px;height:1440px;pointer-events:none;overflow:visible}
</style>
<script src="node_modules/roughjs/bundled/rough.js"></script>
</head><body><svg id="un" style="position:absolute;inset:0;width:1080px;height:1440px;pointer-events:none"></svg><div class="page">
%%BODY%%
</div>
<svg class="ov" id="ov"></svg>
<script>
window.addEventListener('load',()=>document.fonts.ready.then(()=>{
const R=rough.svg(document.getElementById('ov'));const ov=document.getElementById('ov');
const UN=document.getElementById('un'),R2=rough.svg(UN);
const RED='#D8352A',INK='#1F2A44';
function rel(el){const r=el.getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height,cx:r.left+r.width/2,cy:r.top+r.height/2}}
function add(n){ov.appendChild(n)}
document.querySelectorAll('.mark').forEach((m,i)=>{const b=rel(m),k=m.dataset.k||'ellipse';const o={stroke:RED,strokeWidth:4.5,roughness:1.4,bowing:1.2,seed:i+3};
 if(k==='ellipse'){add(R.ellipse(b.cx,b.cy,b.w,b.h,o))} if(k==='box'){add(R.rectangle(b.x,b.y,b.w,b.h,{...o,roughness:1.1}))}});
document.querySelectorAll('h1 .n').forEach((n,i)=>{const b=rel(n);add(R.ellipse(b.cx,b.cy+4,b.w+34,b.h+6,{stroke:RED,strokeWidth:4,roughness:1.6,seed:20+i}))});
function edge(b,tx,ty){const dx=tx-b.cx,dy=ty-b.cy;const s=Math.max(Math.abs(dx)/(b.w/2+14),Math.abs(dy)/(b.h/2+14));return [b.cx+dx/s,b.cy+dy/s]}
function arrow(a,b,bend=0.25,c=RED){const A=rel(document.querySelector(a)),B=rel(document.querySelector(b));const [x1,y1]=edge(A,B.cx,B.cy),[x2,y2]=edge(B,A.cx,A.cy);
 const mx=(x1+x2)/2-(y2-y1)*bend,my=(y1+y2)/2+(x2-x1)*bend;const o={stroke:c,strokeWidth:4,roughness:1.1,seed:31};add(R.curve([[x1,y1],[mx,my],[x2,y2]],o));
 const ang=Math.atan2(y2-my,x2-mx),L=26;add(R.line(x2,y2,x2-L*Math.cos(ang-0.45),y2-L*Math.sin(ang-0.45),o));add(R.line(x2,y2,x2-L*Math.cos(ang+0.45),y2-L*Math.sin(ang+0.45),o));}
document.querySelectorAll('.rbx').forEach((e,i)=>{const b=rel(e);const c=e.dataset.c==='red'?RED:INK;const f=e.dataset.fill;
 const n=(f?R2:R).rectangle(b.x,b.y,b.w,b.h,{stroke:c,strokeWidth:+(e.dataset.w||3),roughness:1.2,seed:200+i,fill:f||undefined,fillStyle:e.dataset.fs||'hachure',hachureGap:10,fillWeight:2});(f?UN:ov).appendChild(n)});
document.querySelectorAll('.rstrike').forEach((e,i)=>{const b=rel(e);add(R.line(b.x-6,b.cy+2,b.x+b.w+6,b.cy-4,{stroke:RED,strokeWidth:4.5,roughness:1.3,seed:400+i}))});
document.querySelectorAll('.rund').forEach((e,i)=>{const b=rel(e);add(R.line(b.x,b.y+b.h+2,b.x+b.w,b.y+b.h+5,{stroke:RED,strokeWidth:4,roughness:1.3,seed:500+i}))});
%%JS%%
window.DONE=1;}));
</script></body></html>
